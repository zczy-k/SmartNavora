name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'app.js'
      - 'config.js'
      - 'db.js'
      - 'package.json'
      - 'start-with-https.js'
      - 'scripts/check-password.js'
      - 'web/**'
      - 'public/**'
      - 'routes/**'
      - 'middleware/**'
      - 'utils/**'
      - 'scripts/**'
      - '.github/workflows/build-image.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # QEMU 下 arm64 构建偶发挂死，超时强制终止，避免僵尸构建堆积
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartnavora
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old image versions
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          node <<'EOF'
          const owner = process.env.OWNER;
          const repo = 'smartnavora';
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          (async () => {
            let versions = [];
            for (let p = 1; p <= 10; p++) {
              const r = await fetch(`https://api.github.com/users/${owner}/packages/container/${repo}/versions?per_page=100&page=${p}`, { headers });
              const j = await r.json();
              if (!Array.isArray(j) || j.length === 0) break;
              versions.push(...j);
              if (j.length < 100) break;
            }
            const tagged = versions.find(v => (((v.metadata || {}).container || {}).tags || []).includes('latest'));
            if (!tagged) { console.log('No version tagged latest, skip pruning.'); return; }
            // 保留最新一次构建的全部 manifest（索引 + 各架构子清单），其余历史版本删除
            const t = new Date(tagged.created_at).getTime();
            const keep = new Set(versions
              .filter(v => Math.abs(new Date(v.created_at).getTime() - t) < 15 * 60 * 1000)
              .map(v => v.id));
            const del = versions.filter(v => !keep.has(v.id));
            console.log(`total=${versions.length} keep=${keep.size} delete=${del.length}`);
            for (const v of del) {
              const r = await fetch(`https://api.github.com/users/${owner}/packages/container/${repo}/versions/${v.id}`, { method: 'DELETE', headers });
              if (!r.ok) console.log(`delete ${v.id} -> ${r.status}`);
            }
            console.log('Prune done.');
          })().catch(e => console.log('Prune skipped:', e.message));
          EOF
