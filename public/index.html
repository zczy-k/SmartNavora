<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta name="build-id" content="mwn80fr9" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=0">
    <title>CNI新标签页</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <meta name="description" content="个人导航页面，提供常用网站链接和工具集合，让您快速访问常用资源" />
    <meta name="keywords" content="导航,常用网站,工具集合,个人导航,快速访问" />
      <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CNI导航" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <!-- 首屏壁纸尽早开始下载，配合 boot-splash 等解码完成再撤 -->
    <link rel="preload" as="image" href="/background.webp" fetchpriority="high" />
    <!-- 资源预加载提示 -->
    <link rel="preconnect" href="https://main.ssss.nyc.mn" crossorigin>
    <link rel="dns-prefetch" href="https://img.icons8.com">
    <script type="module" crossorigin src="/assets/index-BDh6U2vu.js"></script>
  </head>
  <body style="margin:0;padding:0;background:#1a1a1a;">
    <div id="app" style="min-height:100vh;background:#1a1a1a;"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-logo">CNI</div>
      <div class="boot-bar"></div>
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #1a1a1a;
        transition: opacity .22s ease;
      }
      #boot-splash.out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-logo {
        font: 700 30px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: .36em;
        text-indent: .36em;
        color: rgba(255, 255, 255, .82);
      }
      .boot-bar {
        position: relative;
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, .1);
        overflow: hidden;
      }
      .boot-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 42%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(102, 126, 234, 0), #667eea);
        animation: bootSlide 1.05s cubic-bezier(.45, .05, .55, .95) infinite;
      }
      @keyframes bootSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }
    </style>
    <script>
      // 用户选了非默认壁纸时，head 解析阶段就发起预载，与入口 JS 并行下载，
      // 避免等 Vue 挂载后 loadBgSetting() 才起步、白白拖长启动画面时间
      (function () {
        try {
          var id = parseInt(localStorage.getItem('nav_bg_id') || '1');
          if (!id || id === 1) return;
          var map = {
            2: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&h=1080&fit=crop',
            3: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&h=1080&fit=crop',
            4: 'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1920&h=1080&fit=crop',
            5: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=1920&h=1080&fit=crop',
            6: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1920&h=1080&fit=crop',
            7: 'https://images.unsplash.com/photo-1522383225653-ed111181a951?w=1920&h=1080&fit=crop',
            8: 'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1920&h=1080&fit=crop',
            9: 'https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=1920&h=1080&fit=crop',
            10: 'https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1920&h=1080&fit=crop',
            11: 'https://images.unsplash.com/photo-1476820865390-c52aeebb9891?w=1920&h=1080&fit=crop',
            12: 'https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?w=1920&h=1080&fit=crop',
            13: 'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1920&h=1080&fit=crop',
            14: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1920&h=1080&fit=crop',
            15: 'https://images.unsplash.com/photo-1559128010-7c1ad6e1b6a5?w=1920&h=1080&fit=crop'
          };
          var url = map[id];
          if (!url) return;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.setAttribute('fetchpriority', 'high');
          link.href = url;
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
    <script>
      // 首屏渲染完成后闲时校验部署版本：HTML 被静态托管无缓存头时，浏览器启发式缓存可能留住旧 HTML，
      // 这里比对服务端构建戳，落后则换 URL 静默刷一次（每浏览器每次部署只刷一次）
      (function () {
        var meta = document.querySelector('meta[name="build-id"]');
        if (!meta) return;
        var stamp = meta.getAttribute('content');
        var done = false;
        function probe() {
          if (done) return;
          done = true;
          fetch('/api/data-version', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d.build || d.build === stamp) return;
              try {
                if (localStorage.getItem('nav_build_seen') === d.build) return;
                localStorage.setItem('nav_build_seen', d.build);
              } catch (e) { return; }
              location.replace('/?_b=' + encodeURIComponent(d.build));
            })
            .catch(function () {});
        }
        window.addEventListener('navora:content-ready', function () {
          if ('requestIdleCallback' in window) requestIdleCallback(probe, { timeout: 3000 });
          else setTimeout(probe, 2000);
        }, { once: true });
        setTimeout(probe, 8000);
      })();
    </script>
  </body>
</html>
