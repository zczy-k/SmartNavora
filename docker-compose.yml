services:
  SmartNavora:
    # 国内网络建议走 gh-proxy 加速；直连海外可换回 ghcr.io/zczy-k/smartnavora:latest
    image: gh-proxy.com/docker/ghcr.io/zczy-k/smartnavora:latest
    container_name: SmartNavora
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: 123456
      JWT_SECRET: change-this-secret
      CRYPTO_SECRET: change-this-too
      # Set to false on low-resource platforms if backup jobs trigger restarts.
      AUTO_BACKUP_ENABLED: "true"
    volumes:
      - ./database:/app/database
      - ./backups:/app/backups
      - ./config:/app/config
    restart: unless-stopped
